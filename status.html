<!DOCTYPE html>
<html lang="en">
<head>
<style>body{visibility:hidden}</style>
<meta charset="UTF-8"/>
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/ui/interactions.css">
<script type="module" src="assets/data/data.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<style>html{-webkit-text-size-adjust:100%;text-size-adjust:100%}</style>
<title>System Status — NUKRAX</title>
<meta name="description" content="Live status of NUKRAX platform services."/>
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#07090B">
<link rel="canonical" href="https://nukrax.com/status.html">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="nukrax">
<meta property="og:title" content="System Status — NUKRAX">
<meta property="og:description" content="Live status of NUKRAX platform services.">
<meta property="og:image" content="https://nukrax.com/assets/c-logo.png">
<meta property="og:url" content="https://nukrax.com/status.html">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="System Status — NUKRAX">
<meta name="twitter:description" content="Live status of NUKRAX platform services.">
<meta name="twitter:image" content="https://nukrax.com/assets/c-logo.png">
<link rel="icon" href="assets/c-logo.png" type="image/png"/>
<style>
body{background:var(--black);color:var(--text);font-family:var(--font-b);min-height:100vh}
.st-nav{display:flex;align-items:center;justify-content:space-between;padding:18px clamp(20px,4vw,40px);border-bottom:1px solid var(--line)}
.st-logo{display:flex;align-items:center;gap:11px;text-decoration:none}
.st-logo img{width:28px;height:28px;border-radius:6px}
.st-logo span{font-family:var(--font-logo);font-size:18px;color:var(--white)}

.st-wrap{max-width:760px;margin:0 auto;padding:56px clamp(20px,4vw,44px) 100px}
.st-banner{display:flex;align-items:center;gap:14px;border:1px solid #7FBF8F;background:rgba(127,191,143,.08);
  border-radius:12px;padding:20px 22px;margin-bottom:8px}
.st-banner-dot{width:11px;height:11px;border-radius:50%;background:#7FBF8F;flex-shrink:0}
.st-banner h1{color:var(--white);font-size:17px;font-weight:500}
.st-banner p{color:var(--muted);font-size:12px;margin-top:2px}

.st-demo-note{font-size:11.5px;color:var(--muted);margin:14px 0 32px;padding:10px 14px;border:1px dashed var(--line);border-radius:8px}

.st-services{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:36px}
.st-svc-row{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.st-svc-row:last-child{border-bottom:none}
.st-svc-name{color:var(--text);font-size:13.5px}
.st-svc-status{display:flex;align-items:center;gap:8px;font-family:var(--font-m);font-size:11px;color:#7FBF8F}
.st-svc-dot{width:7px;height:7px;border-radius:50%;background:#7FBF8F}

.st-section-title{font-family:var(--font-m);font-size:var(--fs-11);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}
.st-incident{border:1px solid var(--line);border-radius:10px;padding:16px 20px;color:var(--muted);font-size:13px;text-align:center}
</style>
</head>
<body>

<nav class="st-nav">
  <a href="index.html" class="st-logo"><img src="assets/logo.png" alt="NUKRAX"/><span>nukrax</span></a>
  <div class="nav-right"></div>
</nav>

<div class="st-wrap">
  <div class="st-banner">
    <span class="st-banner-dot" aria-hidden="true"></span>
    <div><h1>All Systems Operational</h1><p id="stUpdated">Checking\u2026</p></div>
  </div>
  <p class="st-demo-note">This page is architecture, not a live monitor yet \u2014 statuses below are demo placeholders. Wiring it to real uptime checks is a future integration.</p>

  <h2 class="st-section-title">Services</h2>
  <div class="st-services" id="stServices"></div>

  <h2 class="st-section-title">Recent Incidents</h2>
  <div class="st-incident">No incidents reported in the last 90 days.</div>
</div>

<script type="module">
// Clearly-labeled demo status data — the architecture (per-service rows,
// timestamp, incident log) is real and ready to point at actual uptime
// checks later; only the values below are placeholders.
const SERVICES = [
  { name: 'Website & Marketing Pages', status: 'Operational' },
  { name: 'Dashboard', status: 'Operational' },
  { name: 'Marketplace & Checkout', status: 'Operational' },
  { name: 'Authentication (Supabase)', status: 'Operational' },
  { name: 'Community Feed', status: 'Operational' },
  { name: 'Documentation', status: 'Operational' },
];

document.getElementById('stServices').innerHTML = SERVICES.map(s => `
  <div class="st-svc-row">
    <span class="st-svc-name">${s.name}</span>
    <span class="st-svc-status"><span class="st-svc-dot" aria-hidden="true"></span>${s.status}</span>
  </div>
`).join('');

document.getElementById('stUpdated').textContent = `Last checked ${new Date().toLocaleString()}`;
document.body.style.visibility = 'visible';
</script>

</body>
</html>
