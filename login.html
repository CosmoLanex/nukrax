<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<meta name="description" content="Log in to your NUKRAX account.">
<meta name="robots" content="noindex, follow">
<link rel="icon" href="assets/c-logo.png" type="image/png" sizes="any">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400&family=Outfit:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<link rel="preload" href="assets/fonts/nukrax-display.woff2" as="font" type="font/woff2" crossorigin>

<style>
@font-face{
  font-family:'NKX Display';
  src:url('assets/fonts/nukrax-display.woff2') format('woff2'),
      url('assets/fonts/nukrax-display.otf') format('opentype');
  font-weight:400;font-style:normal;font-display:swap;
}
:root{
  --black:#07090B;--panel:#0A0F13;--line:#1B2328;--line-lit:#2A353C;
  --muted:#8A9BA3;--text:#D3DBDD;--white:#F2F5F5;--accent:#8FB8C4;--accent-dim:#46626B;
  --font-logo:'NKX Display','Outfit',sans-serif;--font-m:'Space Mono',monospace;--font-b:'Outfit',sans-serif;
  --ease:cubic-bezier(0.22,1,0.36,1);--ease-out:cubic-bezier(0.16,1,0.3,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--black);color:var(--text);font-family:var(--font-b);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px;position:relative;overflow-x:hidden;
}
/* Same quiet ambient glow used across the app pages */
body::before{
  content:'';position:fixed;top:-20%;left:50%;transform:translateX(-50%);
  width:900px;height:900px;border-radius:50%;
  background:radial-gradient(circle, rgba(143,184,196,0.07), transparent 70%);
  pointer-events:none;z-index:0;
}

#page-curtain{position:fixed;inset:0;z-index:9999;background:var(--black);transform:translateY(101%);transition:transform .5s var(--ease);pointer-events:none}
#page-curtain.active{transform:translateY(0)}

.auth-wrap{position:relative;z-index:1;width:100%;max-width:400px;
  opacity:0;transform:translateY(14px);animation:auth-rise .6s var(--ease-out) .05s forwards}
@keyframes auth-rise{to{opacity:1;transform:translateY(0)}}

.auth-logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:36px;text-decoration:none}
.auth-logo img{width:30px;height:30px;border-radius:7px}
.auth-logo span{font-family:var(--font-logo);font-size:20px;color:var(--white);letter-spacing:.02em}

.auth-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:36px 32px}
.auth-title{font-family:var(--font-b);font-size:22px;font-weight:400;color:var(--white);margin-bottom:6px}
.auth-sub{font-size:13.5px;color:var(--muted);margin-bottom:28px;line-height:1.5}

.auth-msg{font-size:12.5px;margin-bottom:14px;min-height:16px}
.auth-msg.err{color:#D98787}
.auth-msg.ok{color:var(--accent)}

.field{position:relative;margin-bottom:14px}
.field input{
  width:100%;background:var(--black);border:1px solid var(--line);color:var(--text);
  padding:13px 16px;border-radius:10px;font-family:var(--font-b);font-size:14px;outline:none;
  transition:border-color .25s var(--ease);
}
.field input:focus{border-color:var(--accent)}
.field input::placeholder{color:var(--muted)}
.field-eye{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;
  color:var(--muted);cursor:pointer;display:flex;padding:4px}
@media (hover:hover) and (pointer:fine){.field-eye:hover{color:var(--white)}}

.forgot-link{background:none;border:none;color:var(--muted);font-size:12.5px;cursor:pointer;
  margin:2px 0 18px;display:block;text-align:right;width:100%;font-family:var(--font-b)}
@media (hover:hover) and (pointer:fine){.forgot-link:hover{color:var(--accent)}}

.auth-submit{
  width:100%;background:var(--accent);color:var(--black);border:none;padding:14px;border-radius:10px;
  font-family:var(--font-b);font-size:14px;font-weight:600;cursor:pointer;
  transition:opacity .25s var(--ease);margin-top:4px;
}
@media (hover:hover) and (pointer:fine){.auth-submit:hover{opacity:.9}}
.auth-submit:disabled{opacity:.6;cursor:default}

.auth-divider{display:flex;align-items:center;gap:12px;margin:24px 0;font-family:var(--font-m);
  font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--line)}

.oauth-btn{
  width:100%;background:transparent;border:1px solid var(--line);color:var(--text);
  padding:13px;border-radius:10px;font-family:var(--font-b);font-size:13.5px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:10px;
  transition:border-color .25s var(--ease),color .25s var(--ease);
}
@media (hover:hover) and (pointer:fine){.oauth-btn:hover{border-color:var(--accent);color:var(--white)}}

.auth-switch{text-align:center;margin-top:26px;font-size:13.5px;color:var(--muted)}
.auth-switch a{color:var(--accent);text-decoration:none}
@media (hover:hover) and (pointer:fine){.auth-switch a:hover{text-decoration:underline}}

.back-home{position:fixed;top:24px;left:24px;z-index:2;font-family:var(--font-m);font-size:11px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-decoration:none;
  display:flex;align-items:center;gap:6px}
@media (hover:hover) and (pointer:fine){.back-home:hover{color:var(--white)}}

/* Animated "confirmation sent" state — same visual language as the site's other auth flows */
.sent-state{padding:8px 4px 4px;text-align:center}
.sent-icon{width:60px;height:60px;margin:4px auto 20px;position:relative}
.sent-icon svg{width:100%;height:100%;overflow:visible}
.sent-ring{fill:none;stroke:var(--accent);stroke-opacity:.18;stroke-width:2}
.sent-circle{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;
  stroke-dasharray:151;stroke-dashoffset:151;animation:draw-circle .5s cubic-bezier(.65,0,.35,1) .05s forwards}
.sent-check{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:32;stroke-dashoffset:32;animation:draw-check .35s cubic-bezier(.65,0,.35,1) .45s forwards}
.sent-title{font-size:19px;color:var(--white);margin-bottom:10px;opacity:0;transform:translateY(6px);
  animation:sent-rise .5s var(--ease-out) .55s forwards}
.sent-sub{font-size:13.5px;line-height:1.55;color:var(--muted);opacity:0;transform:translateY(6px);
  animation:sent-rise .5s var(--ease-out) .65s forwards}
@keyframes draw-circle{to{stroke-dashoffset:0}}
@keyframes draw-check{to{stroke-dashoffset:0}}
@keyframes sent-rise{to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){
  .auth-wrap{animation:none;opacity:1;transform:none}
  .sent-circle,.sent-check,.sent-title,.sent-sub{animation:none;stroke-dashoffset:0;opacity:1;transform:none}
}
</style>
</head>
<body>

<div id="page-curtain"></div>

<a href="index.html" class="back-home">← Back to site</a>

<div class="auth-wrap">
  <a href="index.html" class="auth-logo">
    <img src="assets/logo.png" alt="">
    <span>nukrax</span>
  </a>

  <div class="auth-card" id="auth-card">
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-sub">Log in to access your account.</p>

    <div class="auth-msg" id="msg"></div>

    <form id="login-form">
      <div class="field">
        <input type="email" id="email" placeholder="Email" required autocomplete="email">
      </div>
      <div class="field">
        <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
        <button type="button" class="field-eye" id="eye-btn" aria-label="Show password">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <button type="button" class="forgot-link" id="forgot-btn">Forgot password?</button>
      <button type="submit" class="auth-submit" id="submit-btn">Log In</button>
    </form>

    <div class="auth-divider">or continue with</div>
    <button class="oauth-btn" id="github-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5a12 12 0 00-3.79 23.4c.6.11.82-.26.82-.58v-2.02c-3.34.73-4.04-1.61-4.04-1.61-.55-1.4-1.34-1.77-1.34-1.77-1.1-.75.08-.73.08-.73 1.21.09 1.85 1.24 1.85 1.24 1.08 1.84 2.83 1.31 3.52 1 .11-.79.42-1.31.77-1.61-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.13-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 016 0c2.29-1.55 3.3-1.23 3.3-1.23.66 1.66.25 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.63-5.49 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.22.7.83.58A12 12 0 0012 .5z"/></svg>
      GitHub
    </button>

    <p class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></p>
  </div>
</div>

<script type="module">
import { supabase } from './assets/auth/auth-widget.js';

const card = document.getElementById('auth-card');
const msgEl = document.getElementById('msg');
const form = document.getElementById('login-form');
const submitBtn = document.getElementById('submit-btn');
const forgotBtn = document.getElementById('forgot-btn');

function setMsg(t, isErr){
  msgEl.textContent = t || '';
  msgEl.className = 'auth-msg' + (t ? (isErr ? ' err' : ' ok') : '');
}

document.getElementById('eye-btn').addEventListener('click', (e) => {
  const input = document.getElementById('password');
  const isPw = input.type === 'password';
  input.type = isPw ? 'text' : 'password';
});

document.getElementById('github-btn').addEventListener('click', () => {
  supabase.auth.signInWithOAuth({ provider: 'github', options: { redirectTo: window.location.origin + '/index.html' } });
});

function showSentState(text){
  card.innerHTML = `
    <div class="sent-state">
      <div class="sent-icon">
        <svg viewBox="0 0 52 52">
          <circle class="sent-ring" cx="26" cy="26" r="24"/>
          <circle class="sent-circle" cx="26" cy="26" r="24"/>
          <path class="sent-check" d="M15 27l7.2 7L38 18"/>
        </svg>
      </div>
      <h3 class="sent-title">Confirmation email sent</h3>
      <p class="sent-sub">${text}</p>
    </div>
  `;
}

forgotBtn.addEventListener('click', () => {
  card.innerHTML = `
    <button type="button" class="forgot-link" id="back-to-login" style="text-align:left;margin-bottom:18px">← Back</button>
    <h1 class="auth-title">Reset password</h1>
    <p class="auth-sub">We'll email you a link to set a new password.</p>
    <div class="auth-msg" id="msg2"></div>
    <form id="forgot-form">
      <div class="field"><input type="email" id="femail" placeholder="Email" required autocomplete="email"></div>
      <button type="submit" class="auth-submit">Send reset link</button>
    </form>
  `;
  document.getElementById('back-to-login').addEventListener('click', () => window.location.reload());
  const msg2 = document.getElementById('msg2');
  const setMsg2 = (t, isErr) => { msg2.textContent = t || ''; msg2.className = 'auth-msg' + (t ? (isErr ? ' err' : ' ok') : ''); };
  document.getElementById('forgot-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('femail').value.trim();
    setMsg2('Sending...', false);
    const { error } = await supabase.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + '/index.html' });
    if (error) return setMsg2(error.message, true);
    showSentState('Click the link in your inbox to set a new password.');
  });
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  submitBtn.disabled = true;

  setMsg('Checking credentials...', false);
  const { error: pwError } = await supabase.auth.signInWithPassword({ email, password });
  if (pwError) { submitBtn.disabled = false; return setMsg(pwError.message, true); }

  // Same two-step pattern as the rest of the site: don't finalize the
  // session until a fresh email link is clicked.
  await supabase.auth.signOut();
  const { error: otpError } = await supabase.auth.signInWithOtp({
    email,
    options: { shouldCreateUser: false, emailRedirectTo: window.location.origin + '/index.html' }
  });
  submitBtn.disabled = false;
  if (otpError) return setMsg(otpError.message, true);
  showSentState('Click the link in your inbox to finish logging in.');
});

// If already logged in, no reason to sit on the login page.
supabase.auth.getSession().then(({ data }) => {
  if (data.session) window.location.href = 'index.html';
});
</script>

<script>
/* ── PAGE TRANSITIONS — same pattern used across the site ── */
const curtain = document.getElementById('page-curtain');
document.querySelectorAll('a[href]:not([href^="#"]):not([target="_blank"])').forEach(a=>{
  a.addEventListener('click', function(e){
    if(e.defaultPrevented||e.ctrlKey||e.metaKey||e.shiftKey||e.altKey||e.button!==0) return;
    const href = this.getAttribute('href');
    if(!href||href.startsWith('http')||href.startsWith('mailto')) return;
    e.preventDefault();
    curtain.classList.add('active');
    setTimeout(()=>{
      sessionStorage.setItem('nukrax_from_login', 'true');
      window.location.href = href;
    }, 500);
  });
});
if(sessionStorage.getItem('nukrax_from_login')){
  sessionStorage.removeItem('nukrax_from_login');
  curtain.classList.remove('active');
}
window.addEventListener('pageshow', function(event){
  if(event.persisted || (window.performance && window.performance.navigation.type === 2)){
    curtain.classList.remove('active');
  }
});
</script>
</body>
</html>
