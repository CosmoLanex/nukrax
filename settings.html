<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<style>html{-webkit-text-size-adjust:100%;text-size-adjust:100%}</style>
<title>Settings — NUKRAX</title>
<link rel="icon" href="assets/logo.png" type="image/png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@200;300;400;500;600&display=swap" rel="stylesheet"/>
<style>body{visibility:hidden}</style>
<style>
@font-face{
  font-family:'NKX Display';
  src:url('assets/fonts/nukrax-display.woff2') format('woff2'),
      url('assets/fonts/nukrax-display.otf') format('opentype');
  font-weight:400;font-style:normal;font-display:swap;
}
:root{
  --black:#030507;--panel:#0A0F13;--line:#1B2328;--line-lit:#2A353C;
  --muted:#8A9BA3;--text:#D3DBDD;--white:#F2F5F5;--accent:#8FB8C4;--accent-dim:#46626B;
  --font-logo:'NKX Display','Outfit',sans-serif;--font-m:'Space Mono',monospace;--font-b:'Outfit',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--black);color:var(--text);font-family:var(--font-b);min-height:100vh}

.st-nav{display:flex;align-items:center;justify-content:space-between;padding:22px clamp(24px,5vw,64px);
  border-bottom:1px solid var(--line)}
.st-logo{display:flex;align-items:center;gap:11px;text-decoration:none}
.st-logo img{width:30px;height:30px;border-radius:6px}
.st-logo span{font-family:var(--font-logo);font-size:20px;color:var(--white)}
.st-back{font-family:var(--font-m);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-decoration:none}
.st-back:hover{color:var(--accent)}

.st-page{width:100%;max-width:640px;margin:0 auto;padding:56px clamp(24px,5vw,64px) 100px}
.st-page h1{font-family:var(--font-logo);font-size:clamp(28px,4vw,36px);color:var(--white);margin-bottom:40px}

.st-section{margin-bottom:36px;padding-bottom:36px;border-bottom:1px solid var(--line)}
.st-section h2{font-family:var(--font-m);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:18px}

.st-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}
.st-row:last-child{border-bottom:none}
.st-row-text .st-row-title{font-size:14px;color:var(--text)}
.st-row-text .st-row-sub{font-size:12px;color:var(--muted);margin-top:3px}

.st-switch{position:relative;width:42px;height:24px;background:var(--line);border-radius:14px;border:none;cursor:pointer;flex-shrink:0}
.st-switch::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:.2s ease}
.st-switch.on{background:var(--accent-dim)}
.st-switch.on::after{left:21px;background:var(--accent)}

.st-link-row{display:block;padding:14px 0;border-bottom:1px solid var(--line);color:var(--text);text-decoration:none;font-size:14px}
.st-link-row:last-child{border-bottom:none}
.st-link-row:hover{color:var(--accent)}

.st-msg{font-size:12.5px;margin-top:10px;min-height:16px}
.st-msg.ok{color:var(--accent)}
</style>
</head>
<body>

<nav class="st-nav">
  <a href="index.html" class="st-logo"><img src="assets/logo.png" alt=""/><span>nukrax</span></a>
  <a href="index.html" class="st-back">← Back to site</a>
</nav>

<div class="st-page">
  <h1>Settings</h1>

  <div class="st-section">
    <h2>Notifications</h2>
    <div class="st-row">
      <div class="st-row-text">
        <div class="st-row-title">Email me about new followers</div>
      </div>
      <button class="st-switch" id="set-notify-follow"></button>
    </div>
    <div class="st-row">
      <div class="st-row-text">
        <div class="st-row-title">Email me about likes on my posts</div>
      </div>
      <button class="st-switch" id="set-notify-like"></button>
    </div>
  </div>

  <div class="st-section">
    <h2>Privacy</h2>
    <div class="st-row">
      <div class="st-row-text">
        <div class="st-row-title">Private profile</div>
        <div class="st-row-sub">Only people you approve can see your posts</div>
      </div>
      <button class="st-switch" id="set-private"></button>
    </div>
  </div>

  <div class="st-section" style="border-bottom:none">
    <h2>More</h2>
    <a href="profile.html" class="st-link-row">Edit Profile</a>
    <a href="account.html" class="st-link-row">Account &amp; Data</a>
  </div>

  <div class="st-msg" id="st-msg"></div>
</div>

<script type="module">
import { supabase } from './assets/auth/auth-widget.js';

let currentUser = null;
let settings = {};

function setSwitch(el, on) {
  el.classList.toggle('on', !!on);
}

async function saveSettings() {
  const msg = document.getElementById('st-msg');
  msg.textContent = 'Saving...'; msg.className = 'st-msg';
  const { error } = await supabase.from('profiles').update({ settings }).eq('id', currentUser.id);
  msg.textContent = error ? error.message : 'Saved.';
  msg.className = 'st-msg' + (error ? ' err' : ' ok');
}

async function init() {
  const { data } = await supabase.auth.getSession();
  currentUser = data.session?.user || null;
  if (!currentUser) { window.location.replace('index.html?authRequired=1'); return; }

  const { data: profile } = await supabase.from('profiles').select('settings').eq('id', currentUser.id).maybeSingle();
  settings = profile?.settings || {};

  const notifyFollow = document.getElementById('set-notify-follow');
  const notifyLike = document.getElementById('set-notify-like');
  const priv = document.getElementById('set-private');

  setSwitch(notifyFollow, settings.notify_follow !== false);
  setSwitch(notifyLike, settings.notify_like !== false);
  setSwitch(priv, !!settings.private_profile);

  notifyFollow.addEventListener('click', () => { settings.notify_follow = !notifyFollow.classList.contains('on'); setSwitch(notifyFollow, settings.notify_follow); saveSettings(); });
  notifyLike.addEventListener('click', () => { settings.notify_like = !notifyLike.classList.contains('on'); setSwitch(notifyLike, settings.notify_like); saveSettings(); });
  priv.addEventListener('click', () => { settings.private_profile = !priv.classList.contains('on'); setSwitch(priv, settings.private_profile); saveSettings(); });

  document.body.style.visibility = 'visible';
}

init();
</script>

</body>
</html>
