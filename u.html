<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/colour/theme.css">
  <script type="module" src="assets/colour/theme.js"></script>
  <link rel="stylesheet" href="assets/membership/membership.css">
  <link rel="stylesheet" href="assets/ui/interactions.css">
  <script type="module" src="assets/data/data.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<style>html{-webkit-text-size-adjust:100%;text-size-adjust:100%}</style>
<title>Profile</title>
<link rel="icon" href="assets/c-logo.png" type="image/png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@200;300;400;500;600&display=swap" rel="stylesheet"/>
<style>body{visibility:hidden}</style>
<style>

:root{
  --black:#030507;
}

html{font-size:16px}
body{background:var(--black);color:var(--text);font-family:var(--font-b);min-height:100vh}

.pf-nav{display:flex;align-items:center;justify-content:space-between;padding:22px clamp(24px,5vw,64px);
  border-bottom:1px solid var(--line)}
.pf-logo{display:flex;align-items:center;gap:11px;text-decoration:none}
.pf-logo img{width:30px;height:30px;border-radius:6px}
.pf-logo span{font-family:var(--font-logo);font-size:20px;color:var(--white);letter-spacing:.02em}
.nav-right{display:flex;align-items:center;gap:16px}

.pf-page{width:100%;max-width:640px;margin:0 auto;padding:40px clamp(20px,5vw,40px) 100px}

.pf-top{display:flex;align-items:center;gap:clamp(20px,5vw,44px);margin-bottom:22px}
.pf-avatar{width:clamp(76px,18vw,104px);height:clamp(76px,18vw,104px);border-radius:50%;background:var(--accent);
  color:var(--black);display:flex;align-items:center;justify-content:center;font-family:var(--font-m);
  font-size:32px;font-weight:700;overflow:hidden;flex-shrink:0;border:1px solid var(--line)}
.pf-avatar img{width:100%;height:100%;object-fit:cover}
.pf-stats{display:flex;gap:clamp(18px,5vw,36px);flex:1}
.pf-stat{text-align:center;cursor:pointer;background:none;border:none;color:var(--text);font-family:var(--font-b)}
.pf-stat strong{display:block;font-size:18px;color:var(--white)}
.pf-stat span{font-size:12.5px;color:var(--muted)}
@media (hover:hover) and (pointer:fine){.pf-stat:not(.pf-stat-static):hover strong{color:var(--accent)}}

.pf-identity{margin-bottom:18px}
.pf-name{font-size:16px;color:var(--white);font-weight:600}
.pf-handle{font-size:13px;color:var(--muted);font-family:var(--font-m);margin-top:2px}
.pf-category{display:inline-block;margin-top:8px;font-size:11.5px;color:var(--accent);background:rgba(143,184,196,.1);
  border:1px solid var(--line);padding:4px 10px;border-radius:12px}
.pf-bio{font-size:13.5px;color:var(--text);margin-top:10px;line-height:1.5;white-space:pre-wrap}

.pf-actions{display:flex;gap:10px;margin-top:20px}
@media (hover:hover) and (pointer:fine){.pf-btn:hover{opacity:.9}}
.pf-btn{flex:1;background:var(--accent);color:var(--black);border:none;padding:11px;border-radius:6px;
  font-family:var(--font-m);font-size:11px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.pf-btn.following{background:transparent;border:1px solid var(--line);color:var(--text)}

.pf-posts-head{font-family:var(--font-m);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);margin:36px 0 14px;border-top:1px solid var(--line);padding-top:24px}
.pf-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.pf-grid-cell{aspect-ratio:1;background:var(--panel);border:1px solid var(--line);overflow:hidden;
  display:flex;align-items:center;justify-content:center;padding:6px}
.pf-grid-cell img{width:100%;height:100%;object-fit:cover}
.pf-grid-cell .pf-grid-text{font-size:11px;color:var(--muted);text-align:center;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical}
.pf-empty{padding:40px 10px;text-align:center;color:var(--muted);font-size:13px;grid-column:1/-1}

.pf-modal-overlay{position:fixed;inset:0;background:rgba(3,5,7,.8);-webkit-backdrop-filter: blur(6px);
  backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;z-index:900;padding:20px}
.pf-modal{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:min(380px,100%);
  max-height:70vh;display:flex;flex-direction:column}
.pf-modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.pf-modal-head h3{font-family:var(--font-m);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--white)}
.pf-modal-close{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer}
@media (hover:hover) and (pointer:fine){.pf-modal-close:hover{color:var(--white)}}
.pf-modal-list{overflow-y:auto;padding:8px}
.pf-modal-row{display:flex;align-items:center;gap:12px;padding:10px 10px;border-radius:6px;cursor:pointer}
@media (hover:hover) and (pointer:fine){.pf-modal-row:hover{background:var(--line)}}
.pf-modal-avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--black);
  display:flex;align-items:center;justify-content:center;font-family:var(--font-m);font-weight:700;font-size:13px;overflow:hidden;flex-shrink:0}
.pf-modal-avatar img{width:100%;height:100%;object-fit:cover}
.pf-modal-empty{padding:30px;text-align:center;color:var(--muted);font-size:13px}
</style>
</head>
<body>

<nav class="pf-nav">
  <a href="index.html" class="pf-logo">
    <img src="assets/logo.png" alt="NUKRAX"/>
    <span>nukrax</span>
  </a>
  <div class="nav-right"></div>
</nav>

<div class="pf-page" id="pf-page">Loading...</div>

<script type="module">
import { supabase } from './assets/auth/auth-widget.js';

let currentUser = null;
let viewedProfile = null;
let counts = { posts: 0, followers: 0, following: 0 };
let isFollowing = false;

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

async function init() {
  const page = document.getElementById('pf-page');
  const params = new URLSearchParams(window.location.search);
  const username = params.get('u');

  if (!username) { page.innerHTML = `<div class="pf-empty">No profile specified.</div>`; document.body.style.visibility = 'visible'; return; }

  const { data: session } = await supabase.auth.getSession();
  currentUser = session.session?.user || null;

  const { data: profile } = await supabase.from('profiles').select('*').ilike('username', username).maybeSingle();
  if (!profile) { page.innerHTML = `<div class="pf-empty">No one goes by @${escapeHtml(username)}.</div>`; document.body.style.visibility = 'visible'; return; }

  if (currentUser && profile.id === currentUser.id) { window.location.replace('profile.html'); return; }
  viewedProfile = profile;

  const [postsRes, followersRes, followingRes, myFollowRes] = await Promise.all([
    supabase.from('posts').select('id', { count: 'exact', head: true }).eq('user_id', profile.id),
    supabase.from('follows').select('follower_id', { count: 'exact', head: true }).eq('following_id', profile.id),
    supabase.from('follows').select('following_id', { count: 'exact', head: true }).eq('follower_id', profile.id),
    currentUser ? supabase.from('follows').select('*').eq('follower_id', currentUser.id).eq('following_id', profile.id).maybeSingle() : Promise.resolve({ data: null }),
  ]);
  counts = { posts: postsRes.count || 0, followers: followersRes.count || 0, following: followingRes.count || 0 };
  isFollowing = !!myFollowRes.data;

  render();
  loadPosts();
  renderProfileBadges();
  document.body.style.visibility = 'visible';
}

async function renderProfileBadges() {
  try {
    const { getMembershipProfile } = await import('./assets/membership/store.js');
    const { tierChip, rankChip, badgeRow } = await import('./assets/membership/render.js');
    // getMembershipProfile expects a user-shaped object with .id — the
    // viewed profile's own row already has everything else it needs.
    const membership = await getMembershipProfile({ id: viewedProfile.id });
    const el = document.getElementById('pfBadgeRow');
    if (el && membership) {
      el.innerHTML = `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">${tierChip(membership)}${rankChip(membership)}</div>${badgeRow(membership)}`;
    }
  } catch {
    /* membership schema not migrated yet on this environment — profile still renders fine without it */
  }
}

function render() {
  const page = document.getElementById('pf-page');
  const displayName = viewedProfile.display_name || viewedProfile.username;
  const avatarUrl = viewedProfile.avatar_url || '';
  const category = viewedProfile.position || '';
  const bio = viewedProfile.bio || '';
  const initial = (displayName || '?').charAt(0).toUpperCase();

  page.innerHTML = `
    <div class="pf-top">
      <div class="pf-avatar">${avatarUrl ? `<img src="${escapeHtml(avatarUrl)}" alt="">` : initial}</div>
      <div class="pf-stats">
        <div class="pf-stat pf-stat-static"><strong>${counts.posts}</strong><span>Posts</span></div>
        <button class="pf-stat" id="pf-followers-btn"><strong>${counts.followers}</strong><span>Followers</span></button>
        <button class="pf-stat" id="pf-following-btn"><strong>${counts.following}</strong><span>Following</span></button>
      </div>
    </div>
    <div class="pf-identity">
      <div class="pf-name">${escapeHtml(displayName)}</div>
      <div class="pf-handle">@${escapeHtml(viewedProfile.username)}</div>
      ${category ? `<div class="pf-category">${escapeHtml(category)}</div>` : ''}
      ${bio ? `<div class="pf-bio">${escapeHtml(bio)}</div>` : ''}
      <div id="pfBadgeRow" style="margin-top:12px"></div>
    </div>
    ${currentUser ? `
    <div class="pf-actions">
      <button class="pf-btn ${isFollowing ? 'following' : ''}" id="pf-follow-btn">${isFollowing ? 'Following' : 'Follow'}</button>
    </div>` : ''}
    <div class="pf-posts-head">Posts</div>
    <div class="pf-grid" id="pf-grid"><div class="pf-empty">Loading...</div></div>
  `;

  if (currentUser) {
    document.getElementById('pf-follow-btn').addEventListener('click', async () => {
      const btn = document.getElementById('pf-follow-btn');
      if (isFollowing) {
        await supabase.from('follows').delete().eq('follower_id', currentUser.id).eq('following_id', viewedProfile.id);
        isFollowing = false;
        btn.textContent = 'Follow'; btn.classList.remove('following');
        counts.followers = Math.max(0, counts.followers - 1);
      } else {
        await supabase.from('follows').insert({ follower_id: currentUser.id, following_id: viewedProfile.id });
        await supabase.from('notifications').insert({ user_id: viewedProfile.id, actor_id: currentUser.id, type: 'follow' });
        isFollowing = true;
        btn.textContent = 'Following'; btn.classList.add('following');
        counts.followers += 1;
      }
      document.querySelector('#pf-followers-btn strong').textContent = counts.followers;
    });
  }

  document.getElementById('pf-followers-btn').addEventListener('click', () => openListModal('followers'));
  document.getElementById('pf-following-btn').addEventListener('click', () => openListModal('following'));
}

async function loadPosts() {
  const grid = document.getElementById('pf-grid');
  const { data: posts } = await supabase.from('posts').select('*').eq('user_id', viewedProfile.id).order('created_at', { ascending: false }).limit(30);
  if (!posts || !posts.length) { grid.innerHTML = `<div class="pf-empty">No posts yet.</div>`; return; }
  grid.innerHTML = posts.map(p => `
    <div class="pf-grid-cell">
      ${p.image_url ? `<img src="${escapeHtml(p.image_url)}" alt="">` : `<div class="pf-grid-text">${escapeHtml(p.content || '')}</div>`}
    </div>
  `).join('');
}

async function openListModal(kind) {
  const overlay = document.createElement('div');
  overlay.className = 'pf-modal-overlay';
  overlay.innerHTML = `
    <div class="pf-modal">
      <div class="pf-modal-head">
        <h3>${kind === 'followers' ? 'Followers' : 'Following'}</h3>
        <button class="pf-modal-close">×</button>
      </div>
      <div class="pf-modal-list"><div class="pf-modal-empty">Loading...</div></div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
  overlay.querySelector('.pf-modal-close').addEventListener('click', () => overlay.remove());

  const listEl = overlay.querySelector('.pf-modal-list');
  const col = kind === 'followers' ? 'follower_id' : 'following_id';
  const matchCol = kind === 'followers' ? 'following_id' : 'follower_id';
  const { data: rows } = await supabase.from('follows').select(col).eq(matchCol, viewedProfile.id);
  const ids = (rows || []).map(r => r[col]);

  if (!ids.length) { listEl.innerHTML = `<div class="pf-modal-empty">No one here yet.</div>`; return; }

  const { data: profiles } = await supabase.from('profiles').select('*').in('id', ids);
  listEl.innerHTML = (profiles || []).map(p => {
    const initial = (p.display_name || p.username || '?').charAt(0).toUpperCase();
    return `
      <div class="pf-modal-row" data-username="${escapeHtml(p.username || '')}">
        <div class="pf-modal-avatar">${p.avatar_url ? `<img src="${escapeHtml(p.avatar_url)}" alt="">` : initial}</div>
        <div>${escapeHtml(p.display_name || p.username || 'User')}</div>
      </div>
    `;
  }).join('') || `<div class="pf-modal-empty">No one here yet.</div>`;

  listEl.querySelectorAll('.pf-modal-row').forEach(row => {
    row.addEventListener('click', () => {
      const u = row.dataset.username;
      if (u) window.location.href = `u.html?u=${encodeURIComponent(u)}`;
    });
  });
}

init();
</script>

</body>
</html>
