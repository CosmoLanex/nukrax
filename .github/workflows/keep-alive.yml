  workflow_dispatch:         # lets you also trigger it manually to test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -s "https://gxmpaurwuiaxurqnxeck.supabase.co/rest/v1/profiles?select=id&limit=1" \
