<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Profile — NUKRAX</title>
<meta name="description" content="Manage your NUKRAX account."/>
<link rel="icon" href="assets/logo.png" type="image/png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@200;300;400;500;600&display=swap" rel="stylesheet"/>
<style>body{visibility:hidden}</style>
<style>
@font-face{
  font-family:'NKX Display';
  src:url('assets/fonts/nukrax-display.woff2') format('woff2'),
      url('assets/fonts/nukrax-display.otf') format('opentype');
  font-weight:400;font-style:normal;font-display:swap;
}
:root{
  --black:#030507;--panel:#0A0F13;--line:#1B2328;--line-lit:#2A353C;
  --muted:#8A9BA3;--text:#D3DBDD;--white:#F2F5F5;--accent:#8FB8C4;--accent-dim:#46626B;
  --font-logo:'NKX Display','Outfit',sans-serif;--font-m:'Space Mono',monospace;--font-b:'Outfit',sans-serif;
  --ease:cubic-bezier(0.22,1,0.36,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{background:var(--black);color:var(--text);font-family:var(--font-b);min-height:100vh}

.pf-nav{display:flex;align-items:center;justify-content:space-between;padding:22px clamp(24px,5vw,64px);
  border-bottom:1px solid var(--line)}
.pf-logo{display:flex;align-items:center;gap:11px;text-decoration:none}
.pf-logo img{width:30px;height:30px;border-radius:6px}
.pf-logo span{font-family:var(--font-logo);font-size:20px;color:var(--white);letter-spacing:.02em}
.pf-back{font-family:var(--font-m);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  text-decoration:none}
.pf-back:hover{color:var(--accent)}

.pf-wrap{display:flex;justify-content:center;padding:60px 20px}
.pf-card{width:100%;max-width:440px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:36px}

.pf-head{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:28px}
.pf-avatar{width:84px;height:84px;border-radius:50%;background:var(--accent);color:var(--black);
  display:flex;align-items:center;justify-content:center;font-family:var(--font-m);font-size:30px;font-weight:700;
  margin-bottom:14px;overflow:hidden}
.pf-avatar img{width:100%;height:100%;object-fit:cover}
.pf-head h1{font-family:var(--font-b);font-size:20px;color:var(--white);margin-bottom:4px}
.pf-head .pf-email{font-size:12.5px;color:var(--muted);font-family:var(--font-m)}

.pf-section{margin-top:22px;padding-top:22px;border-top:1px solid var(--line)}
.pf-section h2{font-family:var(--font-m);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);margin-bottom:14px}
.pf-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.pf-label{font-size:13px;color:var(--muted)}

.pf-card input{width:100%;background:var(--black);border:1px solid var(--line);color:var(--text);
  padding:11px 12px;border-radius:6px;font-family:var(--font-b);font-size:14px;margin-bottom:10px;outline:none}
.pf-card input:focus{border-color:var(--accent)}
.pf-card input:disabled{opacity:.55}

.pf-btn{width:100%;background:var(--accent);color:var(--black);border:none;padding:12px;border-radius:6px;
  font-family:var(--font-m);font-size:11px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.pf-btn:hover{opacity:.9}
.pf-btn-outline{width:100%;background:transparent;border:1px solid var(--line);color:var(--text);padding:12px;
  border-radius:6px;font-family:var(--font-m);font-size:11px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.pf-btn-outline:hover{border-color:var(--accent);color:var(--white)}
.pf-btn-danger{width:100%;background:transparent;border:1px solid var(--line);color:#D98787;padding:12px;
  border-radius:6px;font-family:var(--font-m);font-size:11px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.pf-btn-danger:hover{border-color:#D98787}

.pf-msg{font-size:12.5px;margin:4px 0 10px;min-height:16px}
.pf-msg.err{color:#D98787}
.pf-msg.ok{color:var(--accent)}
</style>
</head>
<body>

<nav class="pf-nav">
  <a href="index.html" class="pf-logo">
    <img src="assets/logo.png" alt="NUKRAX"/>
    <span>nukrax</span>
  </a>
  <a href="index.html" class="pf-back">← Back to site</a>
</nav>

<div class="pf-wrap">
  <div class="pf-card" id="pf-card">Loading...</div>
</div>

<script type="module">
import { supabase } from './assets/auth/auth-widget.js';

const card = document.getElementById('pf-card');
let currentUser = null;

async function loadProfile() {
  const { data } = await supabase.auth.getSession();
  currentUser = data.session?.user || null;
  if (!currentUser) { window.location.replace('index.html?authRequired=1'); return; }
  render();
}

function render() {
  const meta = currentUser.user_metadata || {};
  const username = meta.username || meta.full_name || meta.user_name || meta.name || '';
  const avatarUrl = meta.avatar_url || meta.picture || '';

  card.innerHTML = `
    <div class="pf-head">
      <div class="pf-avatar" id="pf-avatar">${avatarUrl ? `<img src="${avatarUrl}" alt="">` : (username || currentUser.email).charAt(0).toUpperCase()}</div>
      <h1>${username || currentUser.email}</h1>
      <div class="pf-email">${currentUser.email}</div>
    </div>

    <div class="pf-section">
      <h2>Edit Profile</h2>
      <div class="pf-msg" id="pf-profile-msg"></div>
      <form id="pf-profile-form">
        <input type="text" id="pf-username" placeholder="Username" value="${username}"/>
        <input type="url" id="pf-avatar-url" placeholder="Avatar image URL (optional)" value="${avatarUrl}"/>
        <button type="submit" class="pf-btn">Save changes</button>
      </form>
    </div>

    <div class="pf-section">
      <h2>Change Password</h2>
      <div class="pf-msg" id="pf-pw-msg"></div>
      <form id="pf-pw-form">
        <input type="password" id="pf-newpw" placeholder="New password" minlength="6" required/>
        <input type="password" id="pf-newpw2" placeholder="Confirm new password" minlength="6" required/>
        <button type="submit" class="pf-btn-outline">Update password</button>
      </form>
    </div>

    <div class="pf-section">
      <button class="pf-btn-danger" id="pf-logout">Log Out</button>
    </div>
  `;

  card.querySelector('#pf-profile-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = card.querySelector('#pf-profile-msg');
    msg.textContent = 'Saving...'; msg.className = 'pf-msg';
    const newUsername = card.querySelector('#pf-username').value.trim();
    const newAvatar = card.querySelector('#pf-avatar-url').value.trim();
    const { error } = await supabase.auth.updateUser({ data: { username: newUsername, avatar_url: newAvatar } });
    if (error) { msg.textContent = error.message; msg.className = 'pf-msg err'; return; }
    const { data } = await supabase.auth.getSession();
    currentUser = data.session?.user || currentUser;
    msg.textContent = 'Saved.'; msg.className = 'pf-msg ok';
    render();
  });

  card.querySelector('#pf-pw-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = card.querySelector('#pf-pw-msg');
    const pw1 = card.querySelector('#pf-newpw').value;
    const pw2 = card.querySelector('#pf-newpw2').value;
    if (pw1 !== pw2) { msg.textContent = "Passwords don't match."; msg.className = 'pf-msg err'; return; }
    msg.textContent = 'Updating...'; msg.className = 'pf-msg';
    const { error } = await supabase.auth.updateUser({ password: pw1 });
    if (error) { msg.textContent = error.message; msg.className = 'pf-msg err'; return; }
    msg.textContent = 'Password updated.'; msg.className = 'pf-msg ok';
    card.querySelector('#pf-pw-form').reset();
  });

  card.querySelector('#pf-logout').addEventListener('click', async () => {
    await supabase.auth.signOut();
    window.location.href = 'index.html';
  });
}

loadProfile().then(() => { document.body.style.visibility = 'visible'; });
</script>

</body>
</html>
