<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<style>html{-webkit-text-size-adjust:100%;text-size-adjust:100%}</style>
<title>Set up your account — NUKRAX</title>
<link rel="icon" href="assets/logo.png" type="image/png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@200;300;400;500;600&display=swap" rel="stylesheet"/>
<style>body{visibility:hidden}</style>
<style>
@font-face{
  font-family:'NKX Display';
  src:url('assets/fonts/nukrax-display.woff2') format('woff2'),
      url('assets/fonts/nukrax-display.otf') format('opentype');
  font-weight:400;font-style:normal;font-display:swap;
}
:root{
  --black:#030507;--panel:#0A0F13;--line:#1B2328;--line-lit:#2A353C;
  --muted:#8A9BA3;--text:#D3DBDD;--white:#F2F5F5;--accent:#8FB8C4;--accent-dim:#46626B;
  --font-logo:'NKX Display','Outfit',sans-serif;--font-m:'Space Mono',monospace;--font-b:'Outfit',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--black);color:var(--text);font-family:var(--font-b);min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:24px}

.su-card{width:100%;max-width:420px}
.su-logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:28px}
.su-logo img{width:30px;height:30px;border-radius:6px}
.su-logo span{font-family:var(--font-logo);font-size:20px;color:var(--white)}

.su-card h1{font-family:var(--font-m);font-size:14px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--white);text-align:center;margin-bottom:6px}
.su-card p.su-sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:28px}

.su-avatar-wrap{display:flex;justify-content:center;margin-bottom:22px;position:relative;width:fit-content;margin-left:auto;margin-right:auto}
.su-avatar{width:88px;height:88px;border-radius:50%;background:var(--panel);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted);cursor:pointer}
.su-avatar img{width:100%;height:100%;object-fit:cover}
.su-avatar svg{width:26px;height:26px}
.su-avatar-hint{position:absolute;bottom:-6px;right:-6px;width:28px;height:28px;border-radius:50%;background:var(--accent);
  color:var(--black);display:flex;align-items:center;justify-content:center;pointer-events:none}
.su-avatar-hint svg{width:13px;height:13px}

.su-field{margin-bottom:14px}
.su-field label{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  font-family:var(--font-m);margin-bottom:7px}
.su-field .su-prefix-wrap{position:relative}
.su-field .su-prefix{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px}
.su-field input,.su-field textarea{width:100%;background:transparent;border:1px solid var(--line);color:var(--text);
  padding:12px 13px;border-radius:6px;font-family:var(--font-b);font-size:14px;outline:none}
.su-field input:focus,.su-field textarea:focus{border-color:var(--accent)}
.su-field input.has-prefix{padding-left:22px}
.su-field textarea{resize:vertical;min-height:70px}
.su-avail{font-size:12px;margin-top:6px;min-height:15px}
.su-avail.ok{color:var(--accent)}
.su-avail.err{color:#D98787}

.su-submit{width:100%;background:var(--accent);color:var(--black);border:none;padding:13px;border-radius:6px;
  font-family:var(--font-m);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;margin-top:8px}
@media (hover:hover) and (pointer:fine){.su-submit:hover{opacity:.9}}
.su-submit:disabled{opacity:.5;cursor:default}
.su-msg{font-size:12.5px;margin-top:12px;text-align:center;min-height:16px}
.su-msg.err{color:#D98787}
</style>
</head>
<body>

<div class="su-card">
  <div class="su-logo"><img src="assets/logo.png" alt=""/><span>nukrax</span></div>
  <h1>Set up your account</h1>
  <p class="su-sub">One last step — pick a username and you're in.</p>

  <div class="su-avatar-wrap">
    <div class="su-avatar" id="su-avatar-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </div>
    <div class="su-avatar-hint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2"/><polyline points="7 9 12 4 17 9"/><line x1="12" y1="4" x2="12" y2="16"/></svg>
    </div>
    <input type="file" id="su-file" accept="image/*" style="display:none"/>
  </div>

  <form id="su-form">
    <div class="su-field">
      <label>Username</label>
      <div class="su-prefix-wrap">
        <span class="su-prefix">@</span>
        <input type="text" id="su-username" class="has-prefix" placeholder="yourname" required minlength="3" maxlength="20" pattern="[a-zA-Z0-9_]+"/>
      </div>
      <div class="su-avail" id="su-avail"></div>
    </div>
    <div class="su-field">
      <label>Display name</label>
      <input type="text" id="su-display" placeholder="Your name" maxlength="40"/>
    </div>
    <div class="su-field">
      <label>Position / role</label>
      <input type="text" id="su-position" placeholder="e.g. Trader, Developer" maxlength="60"/>
    </div>
    <div class="su-field">
      <label>Bio</label>
      <textarea id="su-bio" placeholder="A short line about you" maxlength="160"></textarea>
    </div>
    <button type="submit" class="su-submit" id="su-submit">Complete setup</button>
    <div class="su-msg" id="su-msg"></div>
  </form>
</div>

<script type="module">
import { supabase } from './assets/auth/auth-widget.js';
import { compressImage } from './assets/utils/compress-image.js';

let currentUser = null;
let avatarUrl = '';
let usernameOk = false;
let usernameCheckTimer = null;

async function init() {
  const { data } = await supabase.auth.getSession();
  currentUser = data.session?.user || null;
  if (!currentUser) { window.location.replace('index.html?authRequired=1'); return; }

  // Already set up? Skip straight to the site. (A blank profile row already
  // exists for everyone right after signup — a username is what actually
  // means "done".)
  const { data: existing } = await supabase.from('profiles').select('username').eq('id', currentUser.id).maybeSingle();
  if (existing?.username) { window.location.replace('index.html'); return; }

  document.body.style.visibility = 'visible';
}

const fileInput = document.getElementById('su-file');
document.getElementById('su-avatar-btn').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', async () => {
  const rawFile = fileInput.files[0];
  if (!rawFile || !currentUser) return;
  const file = await compressImage(rawFile, { maxDimension: 512, quality: 0.85 });
  const ext = file.name.split('.').pop();
  const path = `${currentUser.id}/avatar-${Date.now()}.${ext}`;
  const { error } = await supabase.storage.from('avatars').upload(path, file, { upsert: true });
  if (error) { document.getElementById('su-msg').textContent = error.message; document.getElementById('su-msg').className = 'su-msg err'; return; }
  const { data } = supabase.storage.from('avatars').getPublicUrl(path);
  avatarUrl = data.publicUrl;
  document.getElementById('su-avatar-btn').innerHTML = `<img src="${avatarUrl}" alt="">`;
});

const usernameInput = document.getElementById('su-username');
const availEl = document.getElementById('su-avail');
usernameInput.addEventListener('input', () => {
  usernameOk = false;
  const val = usernameInput.value.trim();
  clearTimeout(usernameCheckTimer);
  if (val.length < 3) { availEl.textContent = ''; return; }
  availEl.textContent = 'Checking...'; availEl.className = 'su-avail';
  usernameCheckTimer = setTimeout(async () => {
    const { data } = await supabase.from('profiles').select('id').ilike('username', val).maybeSingle();
    if (data) { availEl.textContent = 'Already taken.'; availEl.className = 'su-avail err'; usernameOk = false; }
    else { availEl.textContent = 'Available.'; availEl.className = 'su-avail ok'; usernameOk = true; }
  }, 400);
});

document.getElementById('su-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('su-msg');
  const submitBtn = document.getElementById('su-submit');
  const username = usernameInput.value.trim();

  if (!usernameOk) { msg.textContent = 'Pick an available username first.'; msg.className = 'su-msg err'; return; }

  submitBtn.disabled = true;
  msg.textContent = 'Saving...'; msg.className = 'su-msg';

  const displayName = document.getElementById('su-display').value.trim();
  const position = document.getElementById('su-position').value.trim();
  const bio = document.getElementById('su-bio').value.trim();

  const { error } = await supabase.from('profiles').upsert({
    id: currentUser.id,
    username,
    display_name: displayName || username,
    avatar_url: avatarUrl,
    position,
    bio
  }, { onConflict: 'id' });

  if (error) {
    submitBtn.disabled = false;
    msg.textContent = error.message.includes('reserved') ? 'That username is reserved.' :
                       error.message.includes('duplicate') ? 'That username was just taken — try another.' :
                       error.message;
    msg.className = 'su-msg err';
    return;
  }

  // Keep existing pages (profile.html, nav widget) in sync — they read user_metadata.
  await supabase.auth.updateUser({ data: { username, avatar_url: avatarUrl, full_name: displayName } });

  window.location.href = 'community.html';
});

init();
</script>

</body>
</html>
