<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/colour/theme.css">
  <script type="module" src="assets/colour/theme.js"></script>
  <link rel="stylesheet" href="assets/shell/shell.css">
  <script type="module" src="assets/shell/shell.js" data-page="community"></script>
  <link rel="stylesheet" href="assets/ui/interactions.css">
  <script type="module" src="assets/data/data.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<style>html{-webkit-text-size-adjust:100%;text-size-adjust:100%}</style>
<title>Community</title>
<meta name="description" content="Post, share projects, and connect with other Nukrax builders and traders."/>
<link rel="icon" href="assets/c-logo.png" type="image/png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@200;300;400;500;600&display=swap" rel="stylesheet"/>
<style>body{visibility:hidden}</style>
<style>

:root{
  --black:#030507;
}

html{font-size:16px}
body{background:var(--black);color:var(--text);font-family:var(--font-b);min-height:100vh}

/* ── top bar ── */
.cm-ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.cm-ambient::before,.cm-ambient::after{
  content:'';position:absolute;border-radius:50%;filter:blur(90px);opacity:.16;
  background:radial-gradient(circle, var(--accent), transparent 70%);
}
.cm-ambient::before{width:520px;height:520px;top:-160px;left:-120px;
  animation:cm-drift-a 26s ease-in-out infinite alternate}
.cm-ambient::after{width:420px;height:420px;bottom:-140px;right:-100px;
  animation:cm-drift-b 30s ease-in-out infinite alternate}
@keyframes cm-drift-a{to{transform:translate(60px,40px)}}
@keyframes cm-drift-b{to{transform:translate(-50px,-30px)}}
@media (prefers-reduced-motion: reduce){.cm-ambient::before,.cm-ambient::after{animation:none}}

.cm-back{font-family:var(--font-m);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-decoration:none}
@media (hover:hover) and (pointer:fine){.cm-back:hover{color:var(--accent)}}
.cm-nav .nav-right{display:flex;align-items:center;gap:14px}

/* ── main area ── */
.cm-main{max-width:640px;margin:0 auto;padding:14px 0 40px;position:relative;z-index:1}
.cm-view.active{animation:cm-rise .5s cubic-bezier(.22,1,.36,1) both}
@media (prefers-reduced-motion: reduce){.cm-view.active{animation:none}}
.cm-view{display:none;padding:0 clamp(12px,3vw,24px)}
.cm-view.active{display:block}

.cm-view-head{padding:22px 8px 14px;margin-bottom:6px;font-family:var(--font-m);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.cm-profile-back{background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;font-family:var(--font-m)}
@media (hover:hover) and (pointer:fine){.cm-profile-back:hover{color:var(--accent)}}

.cm-loading,.cm-empty{padding:60px 20px;text-align:center;color:var(--muted);font-size:13.5px}

.cm-empty-state{padding:80px 24px 60px;text-align:center;
  animation:cm-rise .6s cubic-bezier(.22,1,.36,1) both}
.cm-empty-icon{width:56px;height:56px;margin:0 auto 20px;border-radius:50%;
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  color:var(--accent-dim)}
.cm-empty-icon svg{width:22px;height:22px}
.cm-empty-state h3{font-family:var(--font-b);font-size:19px;color:var(--white);margin-bottom:8px;font-weight:400}
.cm-empty-state p{font-size:13.5px;color:var(--muted);margin-bottom:22px}
.cm-empty-cta{background:var(--accent);color:var(--black);border:none;padding:11px 24px;border-radius:20px;
  font-family:var(--font-m);font-size:11px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;
  transition:opacity .3s var(--ease)}
@media (hover:hover) and (pointer:fine){.cm-empty-cta:hover{opacity:.88}}
@keyframes cm-rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ── posts ── */
.cm-post{display:flex;gap:14px;padding:18px;margin:0 4px 10px;border-radius:14px;
  background:var(--panel);border:1px solid var(--line);
  transition:border-color .35s var(--ease)}
@media (hover:hover) and (pointer:fine){.cm-post:hover{border-color:var(--line-lit)}}
.cm-post-avatar{width:42px;height:42px;border-radius:50%;background:var(--accent);color:var(--black);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-family:var(--font-m);font-weight:700;font-size:15px;overflow:hidden}
.cm-post-avatar img{width:100%;height:100%;object-fit:cover}
.cm-post-body{flex:1;min-width:0}
.cm-post-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cm-post-name{font-size:14px;color:var(--white);font-weight:500}
.cm-post-handle{font-size:13px;color:var(--muted)}
.cm-post-time{font-size:12.5px;color:var(--muted)}
.cm-post-text{font-size:14.5px;color:var(--text);margin-top:4px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.cm-post-image{max-width:100%;border-radius:10px;margin-top:10px;border:1px solid var(--line)}
.cm-post-actions{margin-top:12px;display:flex;gap:18px}
.cm-post-edit{margin-left:auto;background:none;border:none;color:var(--muted);font-family:var(--font-m);
  font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;padding:2px 6px}
@media (hover:hover) and (pointer:fine){.cm-post-edit:hover{color:var(--accent)}}
.cm-post-delete{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:0 4px}
@media (hover:hover) and (pointer:fine){.cm-post-delete:hover{color:#D98787}}

.cm-like-btn{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px}
.cm-like-btn svg{width:17px;height:17px}
.cm-like-btn.liked{color:#E0788F}
@media (hover:hover) and (pointer:fine){.cm-like-btn:hover{color:#E0788F}}

.cm-follow-btn{font-family:var(--font-m);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
  background:var(--accent);color:var(--black);border:none;padding:6px 13px;border-radius:14px;cursor:pointer;margin-left:6px}
.cm-follow-btn.following{background:transparent;border:1px solid var(--line);color:var(--text)}
@media (hover:hover) and (pointer:fine){.cm-follow-btn:hover{opacity:.85}}

/* ── search ── */
.cm-search-bar{padding:14px 8px 10px}
.cm-search-bar input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);
  padding:12px 16px;border-radius:20px;font-family:var(--font-b);font-size:14px;outline:none;transition:border-color .25s var(--ease)}
.cm-search-bar input:focus{border-color:var(--accent)}
.cm-user-row{display:flex;align-items:center;gap:12px;padding:14px;margin:0 4px 8px;border-radius:14px;
  background:var(--panel);border:1px solid var(--line);cursor:pointer;transition:border-color .3s var(--ease)}
@media (hover:hover) and (pointer:fine){.cm-user-row:hover{border-color:var(--line-lit)}}
.cm-user-row-text{flex:1;min-width:0}
.cm-user-row-text .cm-post-handle{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}

/* ── notifications ── */
.cm-notif-row{display:flex;gap:12px;padding:14px;margin:0 4px 8px;border-radius:14px;
  background:var(--panel);border:1px solid var(--line)}
.cm-notif-row.unread{border-color:var(--accent-dim);background:rgba(143,184,196,.06)}
.cm-notif-text{font-size:13.5px;color:var(--text);line-height:1.5}

/* ── bottom nav ──
   Mobile (<860px): this used to be its own position:fixed;bottom:0 bar,
   which duplicated/collided with the global shell's own fixed bottom nav
   (assets/shell/shell.js — .nkx-shell-bottomnav, also bottom-fixed). Since
   Community's nav items (Search/Lunox AI/Notifications/Post) aren't a
   subset of the shell's global 7, this stays as Community's own nav, but
   now sticks to the TOP (right below the shell's sticky top bar) instead
   of competing for the bottom edge — matching the same "in-page section
   tabs" pattern the Dashboard uses (.db-mobile-tabs) rather than a second
   bottom bar. Desktop (≥860px) is unaffected: it already becomes a left
   rail there, which never conflicted with the shell's bottom nav (which
   is mobile-only, display:none above 900px). */
.cm-bottomnav{position:sticky;top:var(--nkx-shell-h,64px);left:0;right:0;background:rgba(3,5,7,.92);-webkit-backdrop-filter: blur(10px);
  backdrop-filter:blur(10px);
  border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-around;
  padding:10px 0;z-index:400}
.cm-nav-item{background:none;border:none;color:var(--muted);cursor:pointer;padding:6px;display:flex;
  align-items:center;justify-content:center;transition:color .2s ease,background .2s ease;text-decoration:none}
.cm-nav-item svg{width:23px;height:23px;flex-shrink:0}
.cm-nav-label{display:none}
.cm-nav-item.active{color:var(--accent)}
@media (hover:hover) and (pointer:fine){.cm-nav-item:hover{color:var(--white)}}

.cm-nav-post-btn{display:none}

@media(min-width:860px){
  .cm-bottomnav{
    position:fixed;top:64px;bottom:0;left:0;right:auto;width:88px;
    flex-direction:column;justify-content:flex-start;align-items:stretch;gap:6px;
    padding:20px 14px;border-top:none;border-right:1px solid var(--line);
    background:rgba(3,5,7,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter: blur(14px);
  }
  .cm-nav-item{
    width:100%;height:50px;border-radius:14px;
  }
  .cm-nav-item.active{background:rgba(143,184,196,0.1)}
  @media (hover:hover) and (pointer:fine){.cm-nav-item:hover{background:var(--panel)}}
  .cm-nav-post-btn{display:flex;margin-top:10px;background:var(--accent);color:var(--black)}
  @media (hover:hover) and (pointer:fine){.cm-nav-post-btn:hover{background:var(--accent);opacity:.88}}
  .cm-main{margin:0;margin-left:88px;max-width:640px}
  .cm-fab-wrap{display:none}
}

@media(min-width:1160px){
  .cm-bottomnav{width:248px;padding:20px 16px}
  .cm-nav-item{flex-direction:row;justify-content:flex-start;gap:16px;padding:0 16px}
  .cm-nav-label{display:inline;font-family:var(--font-b);font-size:15px}
  .cm-main{margin-left:248px}
}

/* ── FAB + menu ── */
.cm-fab-wrap{position:fixed;right:20px;bottom:82px;z-index:520;display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.cm-fab{width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--black);border:none;
  display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 18px rgba(143,184,196,.4);
  transition:transform .3s var(--ease)}
.cm-fab svg{width:24px;height:24px;transition:transform .3s var(--ease)}
.cm-fab.open svg{transform:rotate(45deg)}
.cm-fab-menu{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.cm-fab-item{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
  color:var(--text);padding:10px 16px;border-radius:24px;cursor:pointer;font-size:13.5px;font-family:var(--font-b);
  opacity:0;transform:translateY(10px) scale(.9);transition:opacity .22s var(--ease),transform .22s var(--ease);
  pointer-events:none}
.cm-fab-item svg{width:17px;height:17px}
@media (hover:hover) and (pointer:fine){.cm-fab-item:hover{border-color:var(--accent);color:var(--white)}}
.cm-fab-wrap.open .cm-fab-item{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.cm-fab-wrap.open .cm-fab-item:nth-child(1){transition-delay:.06s}
.cm-fab-wrap.open .cm-fab-item:nth-child(2){transition-delay:.03s}
.cm-fab-wrap.open .cm-fab-item:nth-child(3){transition-delay:0s}

/* ── composer modal ── */
.cm-composer-overlay{position:fixed;inset:0;background:rgba(3,5,7,.8);-webkit-backdrop-filter: blur(6px);
  backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;z-index:900;opacity:0;pointer-events:none;transition:opacity .25s;padding:20px}
.cm-composer-overlay.open{opacity:1;pointer-events:auto}
.cm-composer-modal{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:min(480px,100%);
  padding:24px;position:relative}
.cm-composer-modal h3{font-family:var(--font-m);font-size:13px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--white);margin-bottom:16px}
.cm-composer-modal textarea{width:100%;min-height:110px;background:transparent;border:none;color:var(--text);
  font-family:var(--font-b);font-size:15px;resize:vertical;outline:none}
.cm-composer-preview img{max-width:100%;border-radius:8px;margin-top:8px;max-height:220px;object-fit:cover}
.cm-composer-msg{font-size:12px;color:#D98787;min-height:16px;margin-top:6px}
.cm-composer-actions{display:flex;align-items:center;justify-content:space-between;margin-top:12px;
  padding-top:12px;border-top:1px solid var(--line)}
.cm-composer-photo-btn{background:none;border:none;color:var(--accent);cursor:pointer}
.cm-composer-submit{background:var(--accent);color:var(--black);border:none;padding:9px 22px;border-radius:18px;
  font-family:var(--font-m);font-size:11px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
@media (hover:hover) and (pointer:fine){.cm-composer-submit:hover{opacity:.9}}
.cm-composer-close{position:absolute;top:14px;right:16px;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer}
@media (hover:hover) and (pointer:fine){.cm-composer-close:hover{color:var(--white)}}

@media(max-width:560px){
  .cm-nav{padding:14px 16px}
}

/* ── setup-required prompt ── */
.cm-setup-overlay{position:fixed;inset:0;background:rgba(3,5,7,.92);-webkit-backdrop-filter: blur(8px);
  backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;z-index:950;padding:20px}
.cm-setup-box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:32px;
  max-width:340px;text-align:center}
.cm-setup-box h3{font-family:var(--font-b);font-size:22px;color:var(--white);margin-bottom:10px;font-weight:700}
.cm-setup-box p{font-size:13.5px;color:var(--muted);margin-bottom:20px;line-height:1.5}
.cm-setup-box button{background:var(--accent);color:var(--black);border:none;padding:12px 26px;border-radius:20px;
  font-family:var(--font-m);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
@media (hover:hover) and (pointer:fine){.cm-setup-box button:hover{opacity:.9}}
</style>
</head>
<body>

<div class="cm-ambient" aria-hidden="true"></div>


<main class="cm-main">
  <div class="cm-view active" id="cm-view-home">
    <div class="cm-view-head" id="cm-home-head"><span>Home</span></div>
    <div id="cm-feed-container"></div>
  </div>

  <div class="cm-view" id="cm-view-search">
    <div id="cm-search-container"></div>
  </div>

  <div class="cm-view" id="cm-view-notifications">
    <div class="cm-view-head"><span>Notifications</span></div>
    <div id="cm-notif-container"></div>
  </div>
</main>

<div class="cm-fab-wrap" id="cm-fab-wrap">
  <div class="cm-fab-menu">
    <button class="cm-fab-item" id="cm-fab-post">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      Post
    </button>
    <button class="cm-fab-item" id="cm-fab-space">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
      Space
    </button>
    <button class="cm-fab-item" id="cm-fab-photos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      Photos
    </button>
  </div>
  <button class="cm-fab" id="cm-fab-toggle">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>
</div>

<nav class="cm-bottomnav">
  <button class="cm-nav-item active" data-view="home" title="Home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
    <span class="cm-nav-label">Home</span>
  </button>
  <button class="cm-nav-item" data-view="search" title="Search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <span class="cm-nav-label">Search</span>
  </button>
  <a class="cm-nav-item" href="/chat.html" title="Lunox AI">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4L12 2z"/></svg>
    <span class="cm-nav-label">Lunox AI</span>
  </a>
  <a class="cm-nav-item" href="/leaderboard.html" title="Leaderboard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 01-10 0V4z"/><path d="M7 6H4a2 2 0 002 4M17 6h3a2 2 0 01-2 4"/></svg>
    <span class="cm-nav-label">Leaderboard</span>
  </a>
  <button class="cm-nav-item" data-view="notifications" title="Notifications">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
    <span class="cm-nav-label">Notifications</span>
  </button>
  <button class="cm-nav-item cm-nav-post-btn" id="cm-sidebar-post" title="New Post">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
    <span class="cm-nav-label">Post</span>
  </button>
</nav>

<script type="module">
import { supabase } from './assets/auth/auth-widget.js';
import { renderFeed } from './assets/community/feed.js';
import { renderSearchShell } from './assets/community/search.js';
import { renderNotifications } from './assets/community/notifications.js';
import { openComposer } from './assets/community/composer.js';

let currentUser = null;

async function init() {
  const { data } = await supabase.auth.getSession();
  currentUser = data.session?.user || null;
  if (!currentUser) { window.location.replace('/?authRequired=1'); return; }

  const { data: profile } = await supabase.from('profiles').select('username').eq('id', currentUser.id).maybeSingle();
  if (!profile?.username) {
    showSetupPrompt();
  } else {
    await loadHome();
  }
  document.body.style.visibility = 'visible';
}

function showSetupPrompt() {
  const overlay = document.createElement('div');
  overlay.className = 'cm-setup-overlay';
  overlay.innerHTML = `
    <div class="cm-setup-box">
      <h3>Set Up Your Profile</h3>
      <p>Pick a username and photo before jumping into the Community.</p>
      <button id="cm-setup-go">Start Setup</button>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById('cm-setup-go').addEventListener('click', () => {
    window.location.href = '/setup.html';
  });
}

async function loadHome(username = null) {
  const head = document.getElementById('cm-home-head');
  const container = document.getElementById('cm-feed-container');
  head.innerHTML = username
    ? `<button class="cm-profile-back" id="cm-back-to-home">← Home</button><span>@${username}</span>`
    : `<span>Home</span>`;
  if (username) {
    document.getElementById('cm-back-to-home').addEventListener('click', () => loadHome());
  }
  await renderFeed(container, currentUser, username);
}

// ── view switching ──
function switchView(view) {
  document.querySelectorAll('.cm-view').forEach(v => v.classList.remove('active'));
  document.getElementById(`cm-view-${view}`).classList.add('active');
  document.querySelectorAll('.cm-nav-item[data-view]').forEach(btn => btn.classList.toggle('active', btn.dataset.view === view));

  if (view === 'search') renderSearchShell(document.getElementById('cm-search-container'));
  if (view === 'notifications') renderNotifications(document.getElementById('cm-notif-container'), currentUser);
}

document.querySelectorAll('.cm-nav-item[data-view]').forEach(btn => {
  btn.addEventListener('click', () => switchView(btn.dataset.view));
});

// ── FAB menu ──
const fabWrap = document.getElementById('cm-fab-wrap');
const fabToggle = document.getElementById('cm-fab-toggle');
fabToggle.addEventListener('click', () => {
  fabWrap.classList.toggle('open');
  fabToggle.classList.toggle('open');
});

document.getElementById('cm-fab-post').addEventListener('click', () => {
  fabWrap.classList.remove('open'); fabToggle.classList.remove('open');
  openComposer(currentUser, () => { if (document.getElementById('cm-view-home').classList.contains('active')) loadHome(); });
});
document.getElementById('cm-sidebar-post')?.addEventListener('click', () => {
  openComposer(currentUser, () => { if (document.getElementById('cm-view-home').classList.contains('active')) loadHome(); });
});
document.getElementById('cm-fab-photos').addEventListener('click', () => {
  fabWrap.classList.remove('open'); fabToggle.classList.remove('open');
  openComposer(currentUser, () => { if (document.getElementById('cm-view-home').classList.contains('active')) loadHome(); }, { openPhotoPicker: true });
});
document.getElementById('cm-fab-space').addEventListener('click', () => {
  fabWrap.classList.remove('open'); fabToggle.classList.remove('open');
  alert('Live Spaces are coming soon.');
});

init();
</script>

</body>
