<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<style>html{-webkit-text-size-adjust:100%;text-size-adjust:100%}</style>
<title>Account — NUKRAX</title>
<link rel="icon" href="assets/logo.png" type="image/png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@200;300;400;500;600&display=swap" rel="stylesheet"/>
<style>body{visibility:hidden}</style>
<style>
@font-face{
  font-family:'NKX Display';
  src:url('assets/fonts/nukrax-display.woff2') format('woff2'),
      url('assets/fonts/nukrax-display.otf') format('opentype');
  font-weight:400;font-style:normal;font-display:swap;
}
:root{
  --black:#030507;--panel:#0A0F13;--line:#1B2328;--line-lit:#2A353C;
  --muted:#8A9BA3;--text:#D3DBDD;--white:#F2F5F5;--accent:#8FB8C4;--accent-dim:#46626B;
  --font-logo:'NKX Display','Outfit',sans-serif;--font-m:'Space Mono',monospace;--font-b:'Outfit',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--black);color:var(--text);font-family:var(--font-b);min-height:100vh}

.ac-nav{display:flex;align-items:center;justify-content:space-between;padding:22px clamp(24px,5vw,64px);
  border-bottom:1px solid var(--line)}
.ac-logo{display:flex;align-items:center;gap:11px;text-decoration:none}
.ac-logo img{width:30px;height:30px;border-radius:6px}
.ac-logo span{font-family:var(--font-logo);font-size:20px;color:var(--white)}
.ac-back{font-family:var(--font-m);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-decoration:none}
.ac-back:hover{color:var(--accent)}

.ac-page{width:100%;max-width:560px;margin:0 auto;padding:56px clamp(24px,5vw,64px) 100px}
.ac-page h1{font-family:var(--font-logo);font-size:clamp(28px,4vw,36px);color:var(--white);margin-bottom:40px}

.ac-section{margin-bottom:36px;padding-bottom:36px;border-bottom:1px solid var(--line)}
.ac-section h2{font-family:var(--font-m);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:16px}
.ac-info-row{display:flex;justify-content:space-between;padding:9px 0;font-size:14px}
.ac-info-row .ac-label{color:var(--muted)}
.ac-info-row .ac-value{color:var(--text);font-family:var(--font-m);font-size:13px}

.ac-btn{background:var(--accent);color:var(--black);border:none;padding:12px 22px;border-radius:6px;
  font-family:var(--font-m);font-size:11px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.ac-btn:hover{opacity:.9}
.ac-btn-outline{background:transparent;border:1px solid var(--line);color:var(--text);padding:12px 22px;border-radius:6px;
  font-family:var(--font-m);font-size:11px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.ac-btn-outline:hover{border-color:var(--accent);color:var(--white)}
.ac-btn-danger{background:transparent;border:1px solid #D98787;color:#D98787;padding:12px 22px;border-radius:6px;
  font-family:var(--font-m);font-size:11px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.ac-btn-danger:hover{background:#D98787;color:var(--black)}

.ac-danger-text{font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.6}
.ac-msg{font-size:12.5px;margin-top:12px;min-height:16px}
.ac-msg.err{color:#D98787}
.ac-msg.ok{color:var(--accent)}

.ac-confirm-overlay{position:fixed;inset:0;background:rgba(3,5,7,.8);display:none;align-items:center;justify-content:center;z-index:900;padding:20px}
.ac-confirm-overlay.open{display:flex}
.ac-confirm-box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:26px;max-width:380px;width:100%}
.ac-confirm-box h3{font-size:16px;color:var(--white);margin-bottom:10px}
.ac-confirm-box p{font-size:13px;color:var(--muted);margin-bottom:18px;line-height:1.6}
.ac-confirm-box input{width:100%;background:var(--black);border:1px solid var(--line);color:var(--text);padding:10px 12px;
  border-radius:6px;font-family:var(--font-b);font-size:13px;margin-bottom:16px;outline:none}
.ac-confirm-actions{display:flex;gap:10px}
.ac-confirm-actions button{flex:1}
</style>
</head>
<body>

<nav class="ac-nav">
  <a href="index.html" class="ac-logo"><img src="assets/logo.png" alt=""/><span>nukrax</span></a>
  <a href="index.html" class="ac-back">← Back to site</a>
</nav>

<div class="ac-page">
  <h1>Account</h1>

  <div class="ac-section">
    <h2>Account Info</h2>
    <div class="ac-info-row"><span class="ac-label">Email</span><span class="ac-value" id="ac-email">—</span></div>
    <div class="ac-info-row"><span class="ac-label">Username</span><span class="ac-value" id="ac-username">—</span></div>
    <div class="ac-info-row"><span class="ac-label">Joined</span><span class="ac-value" id="ac-joined">—</span></div>
  </div>

  <div class="ac-section" style="border-bottom:none">
    <h2>Share</h2>
    <p style="font-size:13px;color:var(--muted);margin-bottom:14px">Share a link to your public profile.</p>
    <button class="ac-btn-outline" id="ac-share">Copy profile link</button>
    <div class="ac-msg" id="ac-share-msg"></div>
  </div>
</div>

<script type="module">
import { supabase } from './assets/auth/auth-widget.js';

let currentUser = null;

async function init() {
  const { data } = await supabase.auth.getSession();
  currentUser = data.session?.user || null;
  if (!currentUser) { window.location.replace('index.html?authRequired=1'); return; }

  document.getElementById('ac-email').textContent = currentUser.email;
  document.getElementById('ac-joined').textContent = new Date(currentUser.created_at).toLocaleDateString();

  const { data: profile } = await supabase.from('profiles').select('username').eq('id', currentUser.id).maybeSingle();
  document.getElementById('ac-username').textContent = profile ? '@' + profile.username : '(not set up yet)';

  document.body.style.visibility = 'visible';
}

document.getElementById('ac-share').addEventListener('click', async () => {
  const { data: profile } = await supabase.from('profiles').select('username').eq('id', currentUser.id).maybeSingle();
  const msg = document.getElementById('ac-share-msg');
  if (!profile) { msg.textContent = 'Finish setting up your profile first.'; msg.className = 'ac-msg err'; return; }
  const link = `${window.location.origin}/community.html?user=${profile.username}`;
  await navigator.clipboard.writeText(link);
  msg.textContent = 'Link copied.'; msg.className = 'ac-msg ok';
});

init();
</script>

</body>
</html>
