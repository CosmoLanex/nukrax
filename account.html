<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Account — NUKRAX</title>
<meta name="description" content="Sign in or create your NUKRAX account."/>
<link rel="icon" href="assets/logo.png" type="image/png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@200;300;400;500;600&display=swap" rel="stylesheet"/>
<style>
@font-face{
  font-family:'NKX Display';
  src:url('assets/fonts/nukrax-display.woff2') format('woff2'),
      url('assets/fonts/nukrax-display.otf') format('opentype');
  font-weight:400;font-style:normal;font-display:swap;
}
:root{
  --black:#030507;--panel:#0A0F13;--line:#1B2328;--line-lit:#2A353C;
  --muted:#8A9BA3;--text:#D3DBDD;--white:#F2F5F5;--accent:#8FB8C4;--accent-dim:#46626B;
  --font-logo:'NKX Display','Outfit',sans-serif;--font-m:'Space Mono',monospace;--font-b:'Outfit',sans-serif;
  --ease:cubic-bezier(0.22,1,0.36,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{background:var(--black);color:var(--text);font-family:var(--font-b);min-height:100vh}

.acct-nav{display:flex;align-items:center;justify-content:space-between;padding:22px clamp(24px,5vw,64px);
  border-bottom:1px solid var(--line)}
.acct-logo{display:flex;align-items:center;gap:11px;text-decoration:none}
.acct-logo img{width:30px;height:30px;border-radius:6px}
.acct-logo span{font-family:var(--font-logo);font-size:20px;color:var(--white);letter-spacing:.02em}
.acct-back{font-family:var(--font-m);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  text-decoration:none}
.acct-back:hover{color:var(--accent)}

.acct-wrap{display:flex;align-items:center;justify-content:center;padding:60px 20px;min-height:calc(100vh - 76px)}
.acct-card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:36px}
.acct-card h1{font-family:var(--font-m);font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--white);
  margin-bottom:6px}
.acct-card p.sub{font-size:13px;color:var(--muted);margin-bottom:24px}

.acct-tabs{display:flex;gap:4px;margin-bottom:22px;border:1px solid var(--line);border-radius:7px;padding:3px}
.acct-tab{flex:1;text-align:center;padding:10px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  font-family:var(--font-m);color:var(--muted);background:none;border:none;border-radius:5px;cursor:pointer}
.acct-tab.active{background:var(--line);color:var(--white)}

.acct-card input{width:100%;background:var(--black);border:1px solid var(--line);color:var(--text);
  padding:12px 13px;border-radius:6px;font-family:var(--font-b);font-size:14px;margin-bottom:12px;outline:none}
.acct-card input:focus{border-color:var(--accent)}
.acct-submit{width:100%;background:var(--accent);color:var(--black);border:none;padding:13px;border-radius:6px;
  font-family:var(--font-m);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;margin-top:2px}
.acct-submit:hover{opacity:.9}

.acct-divider{display:flex;align-items:center;gap:10px;margin:20px 0;color:var(--muted);font-size:10px;
  text-transform:uppercase;letter-spacing:.08em}
.acct-divider::before,.acct-divider::after{content:'';flex:1;height:1px;background:var(--line)}
.acct-oauth{display:flex;flex-direction:column;gap:9px}
.acct-oauth button{display:flex;align-items:center;justify-content:center;gap:8px;background:transparent;
  border:1px solid var(--line);color:var(--text);padding:11px;border-radius:6px;font-size:14px;cursor:pointer;
  font-family:var(--font-b)}
.acct-oauth button:hover{border-color:var(--accent);color:var(--white)}

.acct-msg{font-size:12.5px;margin-bottom:14px;min-height:16px}
.acct-msg.err{color:#D98787}
.acct-msg.ok{color:var(--accent)}

.acct-profile{text-align:center}
.acct-avatar{width:72px;height:72px;border-radius:50%;background:var(--accent);color:var(--black);
  display:flex;align-items:center;justify-content:center;font-family:var(--font-m);font-size:26px;font-weight:700;
  margin:0 auto 18px;overflow:hidden}
.acct-avatar img{width:100%;height:100%;object-fit:cover}
.acct-profile h2{font-family:var(--font-b);font-size:19px;color:var(--white);margin-bottom:4px}
.acct-profile .email{font-size:13px;color:var(--muted);margin-bottom:26px;font-family:var(--font-m)}
.acct-logout{width:100%;background:transparent;border:1px solid var(--line);color:var(--text);padding:12px;
  border-radius:6px;font-family:var(--font-m);font-size:11px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.acct-logout:hover{border-color:#D98787;color:#D98787}
</style>
</head>
<body>

<nav class="acct-nav">
  <a href="index.html" class="acct-logo">
    <img src="assets/logo.png" alt="NUKRAX"/>
    <span>nukrax</span>
  </a>
  <a href="index.html" class="acct-back">← Back to site</a>
</nav>

<div class="acct-wrap">
  <div class="acct-card" id="acct-card">
    <!-- filled in by script -->
  </div>
</div>

<script type="module">
import { supabase } from './assets/auth/auth-widget.js';

const OAUTH_REDIRECT = `${window.location.origin}/account.html`;
const card = document.getElementById('acct-card');

function renderAuthForm(mode) {
  card.innerHTML = `
    <h1>Access Nukrax</h1>
    <p class="sub">${mode === 'login' ? 'Log in to your account.' : 'Create your account.'}</p>
    <div class="acct-tabs">
      <button class="acct-tab ${mode === 'login' ? 'active' : ''}" data-tab="login">Log In</button>
      <button class="acct-tab ${mode === 'signup' ? 'active' : ''}" data-tab="signup">Sign Up</button>
    </div>
    <div class="acct-msg" id="acct-msg"></div>
    <form id="acct-form">
      <input type="email" id="acct-email" placeholder="Email" required autocomplete="email"/>
      <input type="password" id="acct-password" placeholder="Password" required minlength="6"
        autocomplete="${mode === 'login' ? 'current-password' : 'new-password'}"/>
      <button type="submit" class="acct-submit">${mode === 'login' ? 'Log In' : 'Sign Up'}</button>
    </form>
    <div class="acct-divider">or continue with</div>
    <div class="acct-oauth">
      <button id="acct-google">Google</button>
      <button id="acct-github">GitHub</button>
    </div>
  `;

  card.querySelectorAll('.acct-tab').forEach(tab => {
    tab.addEventListener('click', () => renderAuthForm(tab.dataset.tab));
  });

  const msg = card.querySelector('#acct-msg');
  const setMsg = (text, isErr) => {
    msg.textContent = text || '';
    msg.className = 'acct-msg' + (text ? (isErr ? ' err' : ' ok') : '');
  };

  card.querySelector('#acct-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = card.querySelector('#acct-email').value.trim();
    const password = card.querySelector('#acct-password').value;
    setMsg('Working...', false);

    const { error } = mode === 'login'
      ? await supabase.auth.signInWithPassword({ email, password })
      : await supabase.auth.signUp({ email, password, options: { emailRedirectTo: OAUTH_REDIRECT } });

    if (error) setMsg(error.message, true);
    else if (mode === 'signup') setMsg('Check your email to confirm your account.', false);
    // on successful login, onAuthStateChange below re-renders as profile
  });

  card.querySelector('#acct-google').addEventListener('click', () => {
    supabase.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: OAUTH_REDIRECT } });
  });
  card.querySelector('#acct-github').addEventListener('click', () => {
    supabase.auth.signInWithOAuth({ provider: 'github', options: { redirectTo: OAUTH_REDIRECT } });
  });
}

function renderProfile(user) {
  const meta = user.user_metadata || {};
  const displayName = meta.full_name || meta.user_name || meta.name || user.email;
  const avatarUrl = meta.avatar_url || meta.picture || '';

  card.innerHTML = `
    <div class="acct-profile">
      <div class="acct-avatar">${avatarUrl ? `<img src="${avatarUrl}" alt="">` : displayName.charAt(0).toUpperCase()}</div>
      <h2>${displayName}</h2>
      <div class="email">${user.email || ''}</div>
      <button class="acct-logout" id="acct-logout">Log Out</button>
    </div>
  `;
  card.querySelector('#acct-logout').addEventListener('click', async () => {
    await supabase.auth.signOut();
  });
}

supabase.auth.getSession().then(({ data }) => {
  const user = data.session?.user;
  user ? renderProfile(user) : renderAuthForm('login');
});

supabase.auth.onAuthStateChange((_event, session) => {
  session?.user ? renderProfile(session.user) : renderAuthForm('login');
});
</script>

</body>
</html>
