<!DOCTYPE html>
<html lang="en">
<head>
<style>body{visibility:hidden}</style>
<meta charset="UTF-8"/>
<link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/colour/theme.css">
  <script type="module" src="assets/colour/theme.js"></script>
  <link rel="stylesheet" href="assets/shell/shell.css">
  <script type="module" src="assets/shell/shell.js" data-page="leaderboard"></script>
<link rel="stylesheet" href="assets/membership/membership.css">
<link rel="stylesheet" href="assets/ui/interactions.css">
<script type="module" src="assets/data/data.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<style>html{-webkit-text-size-adjust:100%;text-size-adjust:100%}</style>
<title>Leaderboard — NUKRAX</title>
<meta name="description" content="The Top 28 NUKRAX community leaderboard — rank, level, and points."/>
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#07090B">
<link rel="canonical" href="https://nukrax.com/leaderboard.html">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="nukrax">
<meta property="og:title" content="Leaderboard — NUKRAX">
<meta property="og:description" content="The Top 28 NUKRAX community leaderboard — rank, level, and points.">
<meta property="og:image" content="https://nukrax.com/assets/c-logo.png">
<meta property="og:url" content="https://nukrax.com/leaderboard.html">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Leaderboard — NUKRAX">
<meta name="twitter:description" content="The Top 28 NUKRAX community leaderboard — rank, level, and points.">
<meta name="twitter:image" content="https://nukrax.com/assets/c-logo.png">
<link rel="icon" href="assets/c-logo.png" type="image/png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@200;300;400;500;600&display=swap" rel="stylesheet"/>
<style>
body{background:var(--black);color:var(--text);font-family:var(--font-b);min-height:100vh}
.lb-nav{display:flex;align-items:center;justify-content:space-between;padding:18px clamp(20px,4vw,40px);border-bottom:1px solid var(--line)}
.lb-logo{display:flex;align-items:center;gap:11px;text-decoration:none}
.lb-logo img{width:28px;height:28px;border-radius:6px}
.lb-logo span{font-family:var(--font-logo);font-size:18px;color:var(--white)}

.lb-hero{max-width:900px;margin:0 auto;padding:56px clamp(20px,4vw,44px) 10px;text-align:center}
.lb-hero h1{font-family:var(--font-logo);font-size:clamp(28px,4vw,40px);color:var(--white);margin-bottom:12px}
.lb-hero p{color:var(--muted);font-size:14px;max-width:520px;margin:0 auto;line-height:1.7}

.lb-demo-banner{
  max-width:900px;margin:22px auto 0;padding:12px 18px;border:1px dashed var(--line);border-radius:9px;
  font-size:12px;color:var(--muted);text-align:center;
}
.lb-demo-banner strong{color:var(--text)}

.lb-wrap{max-width:900px;margin:0 auto;padding:36px clamp(20px,4vw,44px) 100px}

.lb-podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:32px}
.lb-podium-card{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:22px 16px;text-align:center}
.lb-podium-card.gold{border-color:#E8C468;order:2;padding-top:30px}
.lb-podium-card.silver{order:1}
.lb-podium-card.bronze{order:3}
.lb-podium-rank{font-family:var(--font-logo);font-size:26px;color:var(--white);margin-bottom:8px}
.lb-podium-card.gold .lb-podium-rank{color:#E8C468}
.lb-podium-name{color:var(--white);font-size:13.5px;margin-bottom:6px;word-break:break-word}
.lb-podium-pts{font-family:var(--font-m);font-size:11.5px;color:var(--muted)}
.lb-demo-tag{display:inline-block;font-family:var(--font-m);font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:1px 6px;margin-top:6px}
@media(max-width:600px){.lb-podium{grid-template-columns:1fr}.lb-podium-card{order:0!important}}

.lb-list{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.lb-row{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.lb-row:last-child{border-bottom:none}
@media (hover:hover) and (pointer:fine){.lb-row:hover{background:rgba(143,184,196,.04)}}
.lb-row-rank{font-family:var(--font-m);font-size:13px;color:var(--muted);width:28px;flex-shrink:0}
.lb-row-avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--black);display:flex;
  align-items:center;justify-content:center;font-family:var(--font-m);font-weight:700;font-size:13px;flex-shrink:0;overflow:hidden}
.lb-row-avatar img{width:100%;height:100%;object-fit:cover}
.lb-row-name{color:var(--white);font-size:13.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:8px}
.lb-row-pts{font-family:var(--font-m);font-size:12px;color:var(--text);flex-shrink:0}
.lb-empty{padding:60px 20px;text-align:center;color:var(--muted);font-size:13px}
</style>
</head>
<body>

<nav class="lb-nav">
  <a href="index.html" class="lb-logo"><img src="assets/logo.png" alt="NUKRAX"/><span>nukrax</span></a>
  <div class="nav-right"></div>
</nav>

<div class="lb-hero">
  <h1>Leaderboard</h1>
  <p>The Top 28 traders on NUKRAX, ranked by community points. Ranks and badges connect directly to your Dashboard profile.</p>
</div>

<div class="lb-demo-banner nkx-reveal" id="lbDemoBanner" hidden></div>

<div class="lb-wrap">
  <div class="lb-podium" id="lbPodium"></div>
  <div class="lb-list" id="lbList"><div class="lb-empty">Loading\u2026</div></div>
</div>

<script type="module">
import { supabase } from './assets/auth/auth-widget.js';
import { DEMO_LEADERBOARD } from './assets/data/demo/leaderboard-demo.js';
import { initScrollReveal } from './assets/ui/reveal.js';

const TOP_N = 28;

function esc(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }

async function loadEntries() {
  // Real query first — this is the actual Supabase integration; demo rows
  // (assets/data/demo/leaderboard-demo.js) only fill in whatever's left.
  const { data: realProfiles } = await supabase
    .from('profiles')
    .select('username, display_name, avatar_url, points, level, rank_number, membership_tier')
    .gt('points', 0)
    .order('points', { ascending: false })
    .limit(TOP_N);

  const real = (realProfiles || []).map((p, i) => ({ ...p, isDemo: false, rank_number: p.rank_number || i + 1 }));
  const usedNames = new Set(real.map(r => r.username));
  const demoFill = DEMO_LEADERBOARD.filter(d => !usedNames.has(d.username)).slice(0, Math.max(0, TOP_N - real.length));

  return { entries: [...real, ...demoFill].slice(0, TOP_N), hasDemo: demoFill.length > 0 };
}

function rowHtml(entry, rank) {
  const name = entry.display_name || entry.username;
  const initial = (name || '?').charAt(0).toUpperCase();
  const href = entry.isDemo ? '#' : `u.html?u=${encodeURIComponent(entry.username)}`;
  return `
    <a href="${href}" class="lb-row" ${entry.isDemo ? 'aria-disabled="true" onclick="return false"' : ''}>
      <span class="lb-row-rank">#${rank}</span>
      <span class="lb-row-avatar">${entry.avatar_url ? `<img src="${esc(entry.avatar_url)}" alt="">` : initial}</span>
      <span class="lb-row-name">${esc(name)} ${entry.isDemo ? '<span class="lb-demo-tag">Demo</span>' : ''}</span>
      <span class="lb-row-pts">${(entry.points || 0).toLocaleString()} pts</span>
    </a>
  `;
}

function podiumCard(entry, rank, cls) {
  if (!entry) return `<div class="lb-podium-card ${cls}"></div>`;
  const name = entry.display_name || entry.username;
  return `
    <div class="lb-podium-card ${cls}">
      <div class="lb-podium-rank">#${rank}</div>
      <div class="lb-podium-name">${esc(name)}</div>
      <div class="lb-podium-pts">${(entry.points || 0).toLocaleString()} pts</div>
      ${entry.isDemo ? '<div class="lb-demo-tag">Demo</div>' : ''}
    </div>
  `;
}

async function init() {
  const { entries, hasDemo } = await loadEntries();

  if (hasDemo) {
    document.getElementById('lbDemoBanner').hidden = false;
    document.getElementById('lbDemoBanner').innerHTML = `<strong>Demo data shown.</strong> Real users appear automatically as they earn points \u2014 this board is already wired to live Supabase data.`;
  }

  document.getElementById('lbPodium').innerHTML =
    podiumCard(entries[1], 2, 'silver') + podiumCard(entries[0], 1, 'gold') + podiumCard(entries[2], 3, 'bronze');

  document.getElementById('lbList').innerHTML = entries.length
    ? entries.map((e, i) => rowHtml(e, i + 1)).join('')
    : `<div class="lb-empty">No ranked users yet.</div>`;

  initScrollReveal();
  document.body.style.visibility = 'visible';
}

init();
</script>

</body>
</html>
